<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opaline | Coming Soon</title>
<meta name="description" content="Opaline is coming soon.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400&display=swap');
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{
  min-height:100vh;display:grid;place-items:center;overflow:hidden;
  color:#eee9df;background:
  radial-gradient(circle at 50% 43%,rgba(89,103,119,.2),transparent 34%),
  linear-gradient(180deg,#080d13 0%,#111820 52%,#070b10 100%);
  font-family:Inter,system-ui,sans-serif;
}
body:before,body:after{content:"";position:fixed;inset:-20%;pointer-events:none}
body:before{
  background:
   radial-gradient(ellipse at 20% 70%,rgba(197,207,214,.06),transparent 28%),
   radial-gradient(ellipse at 78% 25%,rgba(164,180,193,.07),transparent 30%);
  filter:blur(22px);animation:drift 14s ease-in-out infinite alternate;
}
body:after{
  background-image:radial-gradient(rgba(255,255,255,.35) .7px,transparent .7px);
  background-size:95px 95px;opacity:.12;
}
main{text-align:center;position:relative;z-index:2;padding:40px 24px}
.mark{width:74px;height:74px;margin:0 auto 34px;position:relative;opacity:.9}
.mark:before,.mark:after{content:"";position:absolute;inset:12px;border:1px solid rgba(220,226,230,.55);transform:rotate(45deg)}
.mark:after{inset:21px;transform:rotate(45deg);border-color:rgba(220,226,230,.28)}
.mark span{position:absolute;left:50%;top:7px;width:1px;height:60px;background:linear-gradient(transparent,rgba(220,226,230,.7),transparent);transform:rotate(45deg)}
h1{
 margin:0;letter-spacing:.24em;text-indent:.24em;
 font:500 clamp(3.2rem,10vw,7.4rem)/1 Cinzel,serif;
 text-shadow:0 0 38px rgba(208,220,229,.12);
}
.rule{width:min(280px,55vw);height:1px;background:linear-gradient(90deg,transparent,rgba(220,226,230,.45),transparent);margin:30px auto}
h2{margin:0 0 17px;letter-spacing:.38em;text-indent:.38em;font:400 clamp(1rem,2vw,1.3rem)/1.4 Cinzel,serif;color:#d9d5cd}
p{margin:0 auto;color:rgba(232,232,228,.62);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase}
footer{position:fixed;bottom:28px;left:0;right:0;text-align:center;color:rgba(232,232,228,.28);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase}
@keyframes drift{to{transform:translate(2%, -1%) scale(1.04)}}
@media(max-width:600px){h1{letter-spacing:.16em;text-indent:.16em}.rule{margin:24px auto}.mark{margin-bottom:25px}}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><span></span></div>
  <h1>OPALINE</h1>
  <div class="rule"></div>
  <h2>COMING SOON</h2>
  <p>A new world is taking shape.</p>
</main>
<footer>Opaline · The story begins soon</footer>
</body>
</html>
